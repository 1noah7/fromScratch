import groovy.json.JsonOutput
import java.security.MessageDigest

// Separate source set: no launcher or test fixtures enter the production plugin JAR.
sourceSets {
	beta {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}
dependencies {
	betaImplementation 'net.runelite:client:1.13.3'
	betaRuntimeOnly 'net.runelite:jshell:1.13.3'
}
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
def digest = { File input ->
	def hash = MessageDigest.getInstance('SHA-256')
	input.withInputStream { stream ->
		byte[] bytes = new byte[65536]
		for (int n = stream.read(bytes); n >= 0; n = stream.read(bytes)) { if (n > 0) hash.update(bytes, 0, n) }
	}
	hash.digest().encodeHex().toString()
}
def gitText = { List<String> arguments ->
	providers.exec { commandLine(['git'] + arguments) }.standardOutput.asText.get().trim()
}
def betaStage = layout.buildDirectory.dir('beta/stage')
tasks.register('betaJar', Jar) {
	dependsOn tasks.named('betaClasses')
	from sourceSets.beta.output
	archiveFileName.set("from-scratch-beta-launcher-${project.version}.jar")
	destinationDirectory.set(layout.buildDirectory.dir('beta/jars'))
	manifest { attributes('Main-Class': 'com.fromscratch.beta.BetaLauncher', 'Implementation-Version': project.version) }
}
tasks.register('betaStage', Sync) {
	dependsOn tasks.named('jar'), tasks.named('betaJar')
	into betaStage
	from('beta/windows')
	from('LICENSE') { into 'licenses'; rename { 'From-Scratch-LICENSE.txt' } }
	from(tasks.named('jar')) { into 'lib' }
	from(tasks.named('betaJar')) { into 'lib' }
	from(configurations.betaRuntimeClasspath) { into 'lib' }
	inputs.files('build.gradle', 'gradle/beta.gradle', 'runelite-plugin.properties', 'src/beta')
	// Git provenance must be rechecked even if the compiled gameplay source is unchanged.
	outputs.upToDateWhen { false }
	doLast {
		def changed = providers.exec { commandLine 'git', 'diff', '--quiet', 'HEAD', '--', 'src/main'; ignoreExitValue = true }.result.get().exitValue
		if (changed != 0) throw new GradleException('Frozen src/main differs from HEAD. Review gameplay changes before packaging.')
		File root = betaStage.get().asFile
		def artifacts = configurations.betaRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
		def client = artifacts.find { it.moduleVersion.id.group == 'net.runelite' && it.name == 'client' }
		def compileClient = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find { it.moduleVersion.id.group == 'net.runelite' && it.name == 'client' }
		if (client == null || compileClient == null || client.moduleVersion.id.version != compileClient.moduleVersion.id.version)
			throw new GradleException('Production compile and beta RuneLite versions differ. Revalidate before packaging.')
		def names = artifacts.collect { it.file.name }
		if (names.toSet().size() != names.size()) throw new GradleException('Dependency filenames collide; refusing to overwrite a JAR.')
		def dependencies = artifacts.collect { a -> [coordinate: "${a.moduleVersion.id.group}:${a.name}:${a.moduleVersion.id.version}${a.classifier ? ':' + a.classifier : ''}", path: "lib/${a.file.name}", sha256: digest(a.file)] }.sort { it.coordinate }
		new File(root, 'DEPENDENCIES.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([note: 'Unmodified upstream JARs. Their embedded licenses/notices remain intact; see THIRD_PARTY_NOTICES.txt.', artifacts: dependencies])) + '\n'
		def inputs = files('build.gradle', 'gradle/beta.gradle', 'runelite-plugin.properties', fileTree('src/beta')).files.sort { it.path }.collect { f -> [path: rootProject.projectDir.toPath().relativize(f.toPath()).toString().replace('\\', '/'), sha256: digest(f)] }
		new File(root, 'SOURCE.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([revision: gitText(['rev-parse', 'HEAD']), gameplayTree: gitText(['rev-parse', 'HEAD:src/main']), releaseWorktreeDirty: !gitText(['status', '--porcelain']).isEmpty(), inputs: inputs])) + '\n'
		def entries = fileTree(root).files.sort { it.path }.collect { f -> [path: root.toPath().relativize(f.toPath()).toString().replace('\\', '/'), bytes: f.length(), sha256: digest(f)] }
		new File(root, 'package.json').text = JsonOutput.prettyPrint(JsonOutput.toJson([format: 1, version: project.version.toString(), sourceRevision: gitText(['rev-parse', 'HEAD']), gameplayTree: gitText(['rev-parse', 'HEAD:src/main']), runeLiteVersion: client.moduleVersion.id.version, javaMajor: 11, status: 'unpublished-owner-review', mainClass: 'com.fromscratch.beta.BetaLauncher', pluginJar: 'lib/' + tasks.jar.archiveFileName.get(), files: entries])) + '\n'
	}
}
tasks.register('betaZip', Zip) {
	dependsOn tasks.named('betaStage')
	from betaStage
	archiveFileName.set("from-scratch-beta-${project.version}-windows.zip")
	destinationDirectory.set(layout.buildDirectory.dir('distributions'))
}
tasks.register('betaChecksum') {
	dependsOn tasks.named('betaZip')
	doLast {
		File zip = tasks.betaZip.archiveFile.get().asFile
		new File(zip.parentFile, zip.name + '.sha256').text = digest(zip) + '  ' + zip.name + '\n'
		logger.lifecycle("Beta candidate: ${zip.name} (${zip.length()} bytes); SHA-256 sidecar written.")
	}
}
